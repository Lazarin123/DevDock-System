<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="devdock-token" content="__TOKEN__">
<title>devdock</title>
<style>
:root{--bg:#e9eef1;--paper:#f6f9fa;--ink:#13232c;--mute:#5d7280;--line:#c9d5db;--accent:#2450e6;--ok:#17855a;--bad:#c2372b;--warn:#a96a00;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a21;--paper:#14242d;--ink:#e3edf1;--mute:#8aa1ad;--line:#25404d;--accent:#6e90ff;--ok:#43c493;--bad:#ff7466;--warn:#e8b04a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
main{max-width:1060px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between;margin-bottom:22px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
h2{font-size:16px;margin:30px 0 10px}
.sub{color:var(--mute);font-size:13px}
.bar{display:flex;gap:10px;align-items:center}
input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:210px}
.seg button{font:inherit;padding:6px 11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.berths{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.port{font:600 30px/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.name{font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;margin-left:8px;vertical-align:1px}
.node{color:var(--ok)}.docker{color:var(--accent)}.other{color:var(--mute)}.running{color:var(--ok)}.exited,.created{color:var(--mute)}
.cmd{font:12px var(--mono);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60ch}
.acts{display:flex;gap:6px}
.acts button{font:inherit;font-size:13px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.acts button:hover{border-color:var(--ink)}
.acts .kill{color:var(--bad)}.acts .kill:hover{border-color:var(--bad)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:wait}
.empty{padding:26px 16px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}#toast.err{background:var(--bad);color:#fff}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:6px}.cmd{max-width:100%}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>devdock</h1><div class="sub" id="meta">conectando…</div></div>
    <div class="bar">
      <input type="search" id="q" placeholder="Filtrar por porta, nome ou comando" aria-label="Filtrar">
      <div class="seg" role="group" aria-label="Tipo">
        <button data-k="all" aria-pressed="true">Tudo</button><button data-k="node" aria-pressed="false">Node</button><button data-k="docker" aria-pressed="false">Docker</button>
      </div>
    </div>
  </header>
  <h2>Portas em uso</h2>
  <section class="berths" id="ports"></section>
  <h2>Containers</h2>
  <section class="berths" id="docker"></section>
</main>
<div id="toast" role="status"></div>
<script>
const TOKEN = document.querySelector('meta[name=devdock-token]').content;
const $ = (s) => document.querySelector(s);
let state = null, kind = 'all', busy = false;

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ''), 2800); }

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-devdock-token': TOKEN }, body: JSON.stringify(body) } : undefined);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function act(btn, path, body, okMsg) {
  busy = true; btn.disabled = true;
  try { await api(path, body); toast(okMsg); } catch (e) { toast(e.message, true); }
  busy = false; await refresh();
}
function button(label, cls, fn) { const b = el('button', cls, label); b.onclick = () => fn(b); return b; }

function render() {
  if (!state) return;
  const q = $('#q').value.toLowerCase();
  const match = (...s) => !q || s.join(' ').toLowerCase().includes(q);
  const ports = state.ports.filter((p) => (kind === 'all' || p.kind === kind) && match(p.port, p.name, p.command));
  const box = $('#ports'); box.replaceChildren();
  if (!ports.length) box.append(el('div', 'empty', 'Nenhuma porta encontrada com esse filtro.'));
  for (const p of ports) {
    const row = el('div', 'row'), info = el('div'), top = el('div');
    row.append(el('div', 'port', p.port));
    top.append(el('span', 'name', p.name), el('span', 'tag ' + p.kind, p.kind));
    info.append(top, el('div', 'cmd', `pid ${p.pid ?? '?'} · ${p.address} · ${p.uptime}${p.command ? ' · ' + p.command : ''}`));
    const acts = el('div', 'acts');
    if (p.pid) {
      if (state.platform !== 'win32') acts.append(button('Reiniciar', '', (b) => confirm(`Reiniciar "${p.name}" na porta ${p.port}?`) && act(b, '/api/restart', { pid: p.pid }, `:${p.port} reiniciado`)));
      acts.append(button('Encerrar', 'kill', (b) => (p.kind === 'node' || confirm(`"${p.name}" não parece ser Node. Encerrar mesmo assim?`)) && act(b, '/api/kill', { pid: p.pid }, `:${p.port} encerrado`)));
      acts.append(button('Forçar', 'kill', (b) => confirm(`SIGKILL em ${p.name} (pid ${p.pid})?`) && act(b, '/api/kill', { pid: p.pid, force: true }, `pid ${p.pid} morto`)));
    } else acts.append(el('span', 'sub', 'PID oculto (outro usuário)'));
    row.append(info, acts); box.append(row);
  }
  const dbox = $('#docker'); dbox.replaceChildren();
  if (!state.docker.available) dbox.append(el('div', 'empty', 'Docker não encontrado ou daemon parado. Inicie o Docker para ver os containers.'));
  else {
    const cs = state.docker.containers.filter((c) => kind !== 'node' && match(c.name, c.image, c.ports));
    if (!cs.length) dbox.append(el('div', 'empty', 'Nenhum container.'));
    for (const c of cs) {
      const row = el('div', 'row'), info = el('div'), top = el('div'), acts = el('div', 'acts');
      row.append(el('div', 'sub', c.id.slice(0, 8)));
      top.append(el('span', 'name', c.name), el('span', 'tag ' + c.state, c.state));
      info.append(top, el('div', 'cmd', `${c.image} · ${c.status}${c.ports ? ' · ' + c.ports : ''}`));
      const D = (action, msg) => (b) => act(b, '/api/docker', { id: c.name, action }, `${c.name} ${msg}`);
      if (c.state === 'running') acts.append(button('Reiniciar', '', D('restart', 'reiniciado')), button('Parar', 'kill', D('stop', 'parado')));
      else acts.append(button('Iniciar', '', D('start', 'iniciado')));
      row.append(info, acts); dbox.append(row);
    }
  }
  $('#meta').textContent = `${state.ports.length} portas · ${state.docker.containers.filter((c) => c.state === 'running').length} containers ativos · atualiza a cada 2s`;
}

async function refresh() {
  if (busy) return;
  try { state = await api('/api/state'); render(); } catch (e) { $('#meta').textContent = 'sem conexão com o devdock: ' + e.message; }
}
$('#q').oninput = render;
document.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => {
  kind = b.dataset.k; document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b)); render();
}));
refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 2000);
</script>
</body>
</html>
